spring.application.name=backend

# Server Port Configuration
server.port=8080

# MySQL Connection Settings
# Default MySQL port is 3306, not 5432 (that was PostgreSQL's port).
spring.datasource.url=jdbc:postgresql://localhost:5432/student_tracker
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=student_user
spring.datasource.password=userpassword22

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usually auto-detected correctly from the driver, but uncomment if Hibernate
# picks the wrong dialect on startup:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable OSIV warning
spring.jpa.open-in-view=false


#Security settings
spring.security.user.name=admin
spring.security.user.password=admin
logging.level.org.springframework.security=DEBUG